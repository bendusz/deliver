name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validation
        run: bash scripts/validate.sh
      - name: Shellcheck maintainer scripts
        run: shellcheck scripts/*.sh

  # validate.sh already runs the whole suite on Linux; this matrix covers the other two.
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set default branch for fixture repos
        run: git config --global init.defaultBranch main
      - name: Node tests
        run: node --test plugins/deliver/scripts/tests/

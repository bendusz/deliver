name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validation
        run: bash scripts/validate.sh
      - name: Shellcheck maintainer scripts
        run: shellcheck scripts/*.sh plugins/pm-skill/hooks/lib.sh

  node-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure git identity for fixtures
        run: git config --global init.defaultBranch main
      - name: Node tests
        run: node --test plugins/pm-skill/scripts/tests/
